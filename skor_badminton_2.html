<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Skor Badminton">
<meta name="theme-color" content="#0d141c">
<title>Skor Badminton</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#12202f;--mut:#5d6b7c;--a:#1769e0;--b:#e8590c;--ln:#d5dbe3;--ok:#1f9d55;
box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#17212c;--tx:#eef3f8;--mut:#93a1b2;--a:#4c97ff;--b:#ff8a3d;--ln:#2a3846;--ok:#3ddc84}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100%;height:100dvh}
button{font:inherit;color:inherit;border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:10px;cursor:pointer;touch-action:manipulation}
button.p{background:var(--ok);color:#fff;border:0;font-weight:700}
#rot{display:none;position:fixed;inset:0;z-index:9;background:var(--bg);align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){body.playing #rot{display:flex}}
/* setup */
.setup{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:12px;padding:16px;max-width:560px;margin:0 auto}
.setup h1{margin:0;font-size:22px}
.box{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--ln)}
.box label{font-size:12px;color:var(--mut)}
input{font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;width:100%;user-select:text;-webkit-user-select:text}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;font-size:14px}.seg .on{background:var(--tx);color:var(--bg)}
.setup .go{padding:14px;font-size:18px;flex-shrink:0}
.res{border-color:var(--ok);gap:8px}
.ifield{position:relative;display:flex;gap:6px}
.ifield input{flex:1;min-width:0}
.ifield button.dd{flex:0 0 46px;padding:0;font-size:20px;line-height:1;background:var(--tx);color:var(--bg);border:0;border-radius:8px}
.ddm{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:4;max-height:210px;overflow-y:auto;background:var(--card);border:2px solid var(--tx);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.ddm button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);border-radius:0;background:transparent;padding:12px;font-size:16px}
.ddm button:last-child{border-bottom:0}
.tip{font-size:12px;color:var(--mut);text-align:center;line-height:1.4}
/* play */
.play{height:100%;display:grid;grid-template-columns:1fr 24% 1fr}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff;cursor:pointer}
.pn.t0{background:var(--a)}.pn.t1{background:var(--b)}
.pn .nm{font-size:clamp(14px,5vh,26px);font-weight:700;text-align:center;line-height:1.15;padding:0 8px}
.pn .sc{font-size:min(52vh,30vw);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pn .lg{position:absolute;bottom:2.5vh;left:50%;transform:translateX(-50%);width:88%;height:auto;opacity:.95;pointer-events:none}
.pn .sv{min-height:6vh;font-size:clamp(12px,4.5vh,20px);background:rgba(0,0,0,.25);border-radius:20px;padding:3px 12px;visibility:hidden}
.pn.srv .sv{visibility:visible}
.pn .gw{position:absolute;top:8px;left:10px;font-size:clamp(12px,4vh,18px);opacity:.9}
.mid{display:flex;flex-direction:column;gap:6px;padding:8px;justify-content:space-between;background:var(--bg)}
.mid .gn{text-align:center;font-weight:700;font-size:clamp(14px,5vh,22px)}
.mid .hist{flex:1;overflow:auto;font-size:clamp(12px,4vh,17px);color:var(--mut);text-align:center;font-variant-numeric:tabular-nums}
.mid .hist div{padding:2px 0}
.mid .note{font-size:12px;color:var(--mut);text-align:center}
.mid button{font-size:clamp(12px,4vh,16px);padding:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:5}
.ov .m{background:var(--card);border-radius:16px;padding:18px 24px;text-align:center;max-width:80%;display:flex;flex-direction:column;gap:10px}
.ov h2{margin:0;font-size:22px}
.toast{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:6;font-size:15px}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="skorbm_v2",NKEY="skorbm_names";
const DEF={mode:2,bo:3,first:0,target:21,deuce:true,vib:true,snd:true,n:[["",""],["",""]]};
let S=null,hist=[],cfg=JSON.parse(JSON.stringify(DEF)),view="setup",toast="",tt,lastTap=0;

/* ---------- penyimpanan ---------- */
function save(){try{localStorage.setItem(KEY,JSON.stringify({cfg,S,hist:hist.slice(-150)}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||"null");if(!d)return;
  cfg=Object.assign({},DEF,d.cfg||{});if(!Array.isArray(cfg.n)||cfg.n.length<2)cfg.n=DEF.n;
  if(d.S&&d.S.phase!=="match"){S=d.S;S.ask=false;hist=d.hist||[]}}catch(e){}}
function allNames(){let c=[];try{c=JSON.parse(localStorage.getItem(NKEY)||"[]")}catch(e){}return [...new Set([...playerDatabase,...c])]}
function remember(names){try{const c=allNames();names.flat().forEach(n=>{if(!/^Pemain [AB]\d$/.test(n)&&!c.includes(n))c.push(n)});
  localStorage.setItem(NKEY,JSON.stringify(c.filter(n=>!playerDatabase.includes(n))))}catch(e){}}

/* ---------- layar penuh, orientasi, layar menyala, getar, suara ---------- */
async function goFS(){try{const el=document.documentElement;if(document.fullscreenElement||document.webkitFullscreenElement)return;
  const f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)await f.call(el,{navigationUI:"hide"})}catch(e){}}
async function lockOri(m){try{await screen.orientation.lock(m)}catch(e){}}
let WL=null;
async function wake(){try{if("wakeLock"in navigator&&!WL){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}}catch(e){}}
function unwake(){try{WL&&WL.release()}catch(e){}WL=null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view==="play")wake()});
function vib(p){try{if(cfg.vib&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
/* Suara: file ada di folder Sound/ (huruf besar-kecil harus persis sama di GitHub Pages) */
const SND={point:new Audio("Sound/Poin.mp3"),game:new Audio("Sound/Game.mp3")};
Object.values(SND).forEach(a=>{a.preload="auto"});
function play(n){if(!cfg.snd)return;try{const a=SND[n];a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{})}catch(e){}}
document.addEventListener("click",()=>{if(view==="setup")goFS().then(()=>lockOri("portrait"))},{once:true});

/* ---------- setup ---------- */
const seg=(k,o)=>`<div class="seg">${o.map(([v,t])=>`<button class="${cfg[k]===v?"on":""}" onclick="setCfg('${k}',${JSON.stringify(v)})">${t}</button>`).join("")}</div>`;
function setCfg(k,v){cfg[k]=v;save();setup()}
function setup(){
  view="setup";document.body.classList.remove("playing");unwake();lockOri("portrait");
  const d=cfg.mode==2;
  const nm=(t,i)=>`<div class="ifield"><input id="n${t}${i}" placeholder="Pemain ${"AB"[t]}${i+1}" value="${esc(cfg.n[t][i])}" oninput="cfg.n[${t}][${i}]=this.value;save()" autocomplete="off" autocapitalize="words"><button class="dd" aria-label="Pilih nama pemain" onclick="openDD(${t},${i},this)">▼</button></div>`;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone;
  const res=S&&S.phase!=="match"?`<div class="box res"><b>Pertandingan belum selesai</b>
    <div>${esc(S.names[0].join(" / "))} <b>${S.cur[0]}–${S.cur[1]}</b> ${esc(S.names[1].join(" / "))} (Game ${S.gameNo})</div>
    <button class="p" onclick="resume()">▶ Lanjutkan</button><button onclick="toSetup()">Hapus &amp; buat baru</button></div>`:"";
  $("#app").innerHTML=`<div class="setup"><h1>🏸 Skor Badminton</h1>${res}
  <div class="box"><label>Tim A (biru)</label>${nm(0,0)}${d?nm(0,1):""}
   <label>Tim B (oranye)</label>${nm(1,0)}${d?nm(1,1):""}</div>
  <div class="box"><label>Jenis permainan</label>${seg("mode",[[1,"Tunggal"],[2,"Ganda"]])}
   <label>Jumlah game</label>${seg("bo",[[1,"1 game"],[3,"Terbaik dari 3"]])}
   <label>Poin per game</label>${seg("target",[[21,"21 (resmi)"],[15,"15 (latihan)"],[11,"11 (latihan)"]])}
   <label>Setting (deuce)</label>${seg("deuce",[[true,"Selisih 2 poin"],[false,"Langsung menang"]])}
   <label>Servis pertama</label>${seg("first",[[0,"Tim A"],[1,"Tim B"]])}
   <label>Efek tiap poin</label><div class="seg">
    <button class="${cfg.vib?"on":""}" onclick="setCfg('vib',${!cfg.vib})">📳 Getar ${cfg.vib?"ON":"OFF"}</button>
    <button class="${cfg.snd?"on":""}" onclick="setCfg('snd',${!cfg.snd})">🔊 Suara ${cfg.snd?"ON":"OFF"}</button></div></div>
  <button class="p go" onclick="start()">Mulai Pertandingan</button>
  <div class="tip">${ios?"iPhone: ketuk Bagikan → <b>Tambah ke Layar Utama</b> lalu buka dari ikon untuk layar penuh. iOS tidak bisa mengunci orientasi otomatis: matikan <i>Portrait Orientation Lock</i> di Control Center, lalu putar HP.":"Layar penuh &amp; landscape aktif otomatis saat pertandingan dimulai."}</div></div>`;
}
let NL=[];
function closeDD(){document.querySelectorAll(".ddm").forEach(e=>e.remove())}
function openDD(t,i,btn){const had=btn.parentNode.querySelector(".ddm");closeDD();if(had)return;
  NL=allNames();const m=document.createElement("div");m.className="ddm";
  m.innerHTML=NL.map((n,k)=>`<button onclick="chooseDD(${t},${i},${k})">${esc(n)}</button>`).join("");btn.parentNode.appendChild(m)}
function chooseDD(t,i,k){cfg.n[t][i]=NL[k];const e=$("#n"+t+i);if(e)e.value=NL[k];save();closeDD()}
document.addEventListener("click",e=>{if(!e.target.closest(".dd,.ddm"))closeDD()});
function toSetup(){S=null;hist=[];save();setup()}
function start(){
  const names=cfg.n.map((p,t)=>p.slice(0,cfg.mode).map((x,i)=>x.trim()||`Pemain ${"AB"[t]}${i+1}`));
  remember(names);
  S={mode:cfg.mode,bo:cfg.bo,target:cfg.target,cap:{21:30,15:20,11:15}[cfg.target],deuce:cfg.deuce,names,games:[],cur:[0,0],won:[0,0],
     server:cfg.first,right:[0,0],flip:false,phase:"play",gameNo:1,midDone:false,ask:false};
  hist=[];enter();
}
function resume(){S.ask=false;enter()}
function enter(){view="play";document.body.classList.add("playing");render();goFS().then(()=>lockOri("landscape"));wake()}

/* ---------- permainan ---------- */
function snap(){hist.push(JSON.stringify(S))}
function undo(){if(!hist.length)return;S=JSON.parse(hist.pop());render()}
function over(c){const m=Math.max(...c),d=Math.abs(c[0]-c[1]);return S.deuce?((m>=S.target&&d>=2)||m>=S.cap):m>=S.target}
function point(t){
  if(S.phase!=="play")return;
  const now=Date.now();if(now-lastTap<250)return;lastTap=now;
  snap();S.cur[t]++;
  if(S.server===t){if(S.mode==2)S.right[t]=1-S.right[t]}else S.server=t;
  const mid=S.target==21?11:Math.ceil(S.target/2),dec=S.bo==1||S.gameNo==3;
  if(over(S.cur)){
    S.won[t]++;S.games.push(S.cur.slice());
    S.phase=S.won[t]>=Math.ceil(S.bo/2)?"match":"game";
    vib([90,50,90]);play("game");
  }else{
    vib(25);play("point");
    if(!S.midDone&&Math.max(...S.cur)==mid){S.midDone=true;
      if(dec){S.flip=!S.flip;showToast(`Skor ${mid}: tukar sisi lapangan!`)}else showToast(`Interval ${mid} poin`)}
  }
  render();
}
function nextGame(){
  const g=S.games[S.games.length-1],w=g[0]>g[1]?0:1;
  S.gameNo++;S.cur=[0,0];S.server=w;S.right=[0,0];S.flip=!S.flip;S.midDone=false;S.phase="play";hist=[];render();
}
function showToast(t){toast=t;clearTimeout(tt);tt=setTimeout(()=>{toast="";const e=$(".toast");if(e)e.remove()},2500)}
function swap(){snap();S.flip=!S.flip;render()}
function reset(){S.ask=true;render()}
function servInfo(t){
  if(S.server!==t)return "";
  const par=S.cur[t]%2,court=par?"KIRI":"KANAN";
  const who=S.mode==2?S.names[t][par?1-S.right[t]:S.right[t]]:S.names[t][0];
  return `🏸 Servis: ${esc(who)} (${court})`;
}
const tn=t=>esc(S.mode==2?S.names[t].join(" / "):S.names[t][0]);
function panel(t){
  return `<div class="pn t${t} ${S.server===t?"srv":""}" onclick="point(${t})">
   <div class="gw">Game: ${S.won[t]}</div><div class="nm">${tn(t)}</div>
   <div class="sc">${S.cur[t]}</div><div class="sv">${servInfo(t)}</div><img class="lg" src="${LOGO}" alt="Bad Mood On Unofficial"></div>`;
}
function render(){
  const L=S.flip?1:0,R=1-L;
  const h=S.games.map((g,i)=>`<div>G${i+1}: ${g[0]}–${g[1]}</div>`).join("")||"<div>Belum ada game selesai</div>";
  let ov="";
  if(S.phase==="game"){const g=S.games[S.games.length-1];
    ov=`<div class="ov"><div class="m"><h2>Game ${S.gameNo} selesai</h2><div>${g[0]} – ${g[1]}</div>
    <button class="p" onclick="nextGame()">Game berikutnya (sisi ditukar)</button><button onclick="undo()">Batalkan poin terakhir</button></div></div>`}
  if(S.phase==="match"){const w=S.won[0]>S.won[1]?0:1;
    ov=`<div class="ov"><div class="m"><h2>🏆 ${tn(w)} menang!</h2><div>${S.won[0]} – ${S.won[1]} (${S.games.map(g=>g.join("-")).join(", ")})</div>
    <button class="p" onclick="start()">Main lagi (pemain sama)</button><button onclick="undo()">Batalkan poin terakhir</button><button onclick="toSetup()">Pengaturan baru</button></div></div>`}
  if(S.ask)ov=`<div class="ov"><div class="m"><h2>Atur ulang?</h2><div>Skor pertandingan ini akan hilang.</div>
    <button class="p" onclick="toSetup()">Ya, atur ulang</button><button onclick="S.ask=false;render()">Batal</button></div></div>`;
  $("#app").innerHTML=`<div class="play">${panel(L)}
   <div class="mid"><div class="gn">Game ${S.gameNo}</div><div class="hist">${h}</div>
   <div class="note">${S.target} poin${S.deuce?" · selisih 2":""}<br>Ketuk sisi layar untuk tambah poin</div>
   <button onclick="undo()">↶ Undo</button><button onclick="swap()">⇄ Tukar sisi</button><button onclick="reset()">⚙ Atur ulang</button></div>
   ${panel(R)}</div>${ov}${toast?`<div class="toast">${esc(toast)}</div>`:""}`;
  save();
}
load();setup();
</script>
</body>
</html>
